    <script>
    function togglePrescription(show) {
      const prescriptionDiv = document.getElementById('prescription');
      const additionalFields = document.getElementById('additionalFields');
      const providerSection = document.getElementById('providerSection');

      if (show) {
        prescriptionDiv.classList.remove('hidden');
      } else {
        prescriptionDiv.classList.add('hidden');
        additionalFields.classList.add('hidden');
        providerSection.classList.add('hidden');

        document.querySelectorAll('input[name="prescription"]').forEach(el => el.checked = false);
      }
    }

   
    function toggleAdditionalFields(isYes) {
      const additionalFields = document.getElementById('additionalFields');
      const providerSection = document.getElementById('providerSection');

      additionalFields.classList.remove('hidden');

      if (isYes) {
        providerSection.classList.add('hidden');
      } else {
        providerSection.classList.remove('hidden');
      }
    }
  function toggleInsuranceForm(isInsurance) {
    const insuranceForm = document.getElementById('forinsurance');

    if (isInsurance) {
      insuranceForm.classList.remove('hidden'); 
    } else {
      insuranceForm.classList.add('hidden');  
    }
  }
 
  function copyAddressToFacility() {
    const isChecked = document.getElementById('copyAddress').checked;

    if (isChecked) {
      document.getElementById('facilityAddress1').value = document.getElementById('address1').value;
      document.getElementById('facilityAddress2').value = document.getElementById('address2').value;
      document.getElementById('facilityCity').value = document.getElementById('city').value;
      document.getElementById('facilityState').value = document.getElementById('state').value;
      document.getElementById('facilityZip').value = document.getElementById('zipcode').value;

      
      document.getElementById('facilityAddress1').disabled = true;
      document.getElementById('facilityAddress2').disabled = true;
      document.getElementById('facilityCity').disabled = true;
      document.getElementById('facilityState').disabled = true;
      document.getElementById('facilityZip').disabled = true;

    } else {
      
      document.getElementById('facilityAddress1').value = '';
      document.getElementById('facilityAddress2').value = '';
      document.getElementById('facilityCity').value = '';
      document.getElementById('facilityState').value = 'State';
      document.getElementById('facilityZip').value = '';

      document.getElementById('facilityAddress1').disabled = false;
      document.getElementById('facilityAddress2').disabled = false;
      document.getElementById('facilityCity').disabled = false;
      document.getElementById('facilityState').disabled = false;
      document.getElementById('facilityZip').disabled = false;
    }
  }

$(document).ready(function () {
    const urlParams = new URLSearchParams(window.location.search);
    const patientId = urlParams.get('id');

    if (patientId) {
        // Editing mode → fetch patient data
        $.ajax({
            url: "get_patient.php",
            type: "GET",
            data: { id: patientId },
            success: function (response) {
                let patient = JSON.parse(response);

                if (patient) {
                    $("input[name='lastName']").val(patient.lastName);
                    $("input[name='firstName']").val(patient.firstName);
                    $("input[name='external_id']").val(patient.externalId);
                    $("input[name='email']").val(patient.email);
                    $("input[name='mobilenumber']").val(patient.mobileNumber);
                    $("input[name='fax']").val(patient.fax);
                    $("input[name='Address1']").val(patient.address1);
                    $("input[name='Address2']").val(patient.address2);
                    $("input[name='city']").val(patient.city);
                    $("select[name='state']").val(patient.state);
                    $("input[name='zipcode']").val(patient.zipcode);
                    $("select[name='gender']").val(patient.gender);
                    $("input[name='date']").val(patient.appointment_date);
                    $("select[name='swab']").val(patient.swab);
                    $("select[name='attend']").val(patient.facility_name);
                    $("select[name='race']").val(patient.race);

                    // Radio example: ethnicity
                    if (patient.ethnicity) {
                        $(`input[name='ethnicity'][value='${patient.ethnicity}']`).prop('checked', true);
                    }

                    // Payment type radio
                    if (patient.payment_name) {
                        $(`input[name='payment'][value='${patient.payment_name}']`).prop('checked', true);
                    }

                    // Add hidden input for patient_id so Save knows it's an update
                    if ($("#patient_id").length === 0) {
                        $("<input>").attr({
                            type: "hidden",
                            id: "patient_id",
                            name: "id",
                            value: patientId
                        }).appendTo("form");
                    }
                }
            },
            error: function() {
                alert('Unable to fetch patient data.');
            }
        });
    }
});
</script>
</div>
</div>
</form>
</body>
</html>
