$(document).ready(function() {
  // Initialize DataTable
  $('#myDataTable').DataTable({// js  fails when my table trying to accesss...table select
    ajax: {
      url: 'fetch_patients.php',
      dataSrc: 'data' // where the json array have
    },
    columns: [
      {
        data: null, // does not directly map to any json filed
        render: function (data, type, row) {// button, null,, json row,, type context dislplay ,filter,sotrting
          return `
           <button class="btn btn-primary btn-sm view-btn" data-id="${row.patient_id}">View</button><br> <br> 

           <a href="taskdetails.html?id=${row.patient_id}" class="btn btn-primary btn-sm">Edit</a><br> <br> 

            
            <button class="btn btn-primary btn-sm delete-btn" data-id="${row.patient_id}">Delete</button>
          `;
        }
      },// Every button has data-id="42", so JavaScript knows this row is for patient 42.
      { data: 'patient_id' },
       { data: 'doctor' },
      { data: 'prescription' },
      { data: 'lastName' },
      { data: 'firstName' },
      { data: 'dob' },
      { data: 'externalId' },
      { data: 'email' },
      { data: 'mobileNumber' },
      { data: 'fax' },
      { data: 'address1' },
      { data: 'address2' },
      { data: 'ethnicity' },
      { data: 'gender' },
      { data: 'race' },
      { data: 'city' },
     // {data: 'driver_license'},
     
{
  data: 'driver_license',
  render: function (data, type, row) {
    if (!data)
     return '—';
    return ` 
    <a href= "${data}" target="_blank"> ${row.driver_license} </a>`;
  }
},

      { data: 'payment_name' },
      { data: 'swab' },
      { data: 'test_name' },
      { data: 'appointment_date' },
      { data: 'facility_name' },
      { data: 'state' },
      { data: 'zipcode' }
    ],
    order: [[1, 'desc']]
  });

  // ✅ View button (AJAX + modal)
  $('#myDataTable').on('click', '.view-btn', function() {
    let patientId = $(this).data('id');

    $.ajax({
      url: 'view_patient.php',
      type: 'GET',
      data: { id: patientId },
      success: function(response) {
        $('#patientDetails').html(response);
        $('#patientModal').modal('show'); // open the modal
      },
      error: function() {
        alert('Unable to fetch patient details.');
      }
    });
  });

$('#myDataTable').on('click', '.edit-btn', function() {
    let patientId = $(this).data('id');
    window.location.href = "taskdetails.html?id=" + patientId;
});


  

  // ✅ Delete button
  $('#myDataTable').on('click', '.delete-btn', function() {
    let patientId = $(this).data('id');
    if (confirm('Are you sure you want to delete this patient?')) {
      $.ajax({
        url: 'delete_patient.php',
        type: 'POST',
        data: { id: patientId },
        success: function(response) {
          let res = JSON.parse(response);
          if (res.status === 'success') {
            alert('Patient deleted successfully');
            $('#myDataTable').DataTable().ajax.reload();
          } else {
            alert('Error: ' + res.message);
          }
        }
      });
    }
  });

});
</script>
